name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  DATABASE_URL: postgresql://recall:recall@localhost:5432/recall
  JWT_SECRET: ci-only-secret-not-for-production-0123456789abcdef
  JWT_EXPIRES_IN: 1h

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Typecheck y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  database:
    name: Migraciones, seed y colección de Postman
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall
          POSTGRES_DB: recall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:deploy

      - name: Run seed
        run: npm run seed

      - name: Seed again (debe ser repetible)
        run: npm run seed

      - name: Build y arranque del API
        run: |
          npm run build
          node dist/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && exit 0; sleep 1; done
          cat server.log
          exit 1

      - name: Colección de Postman (newman)
        run: npx --yes newman@6 run docs/api.postman_collection.json --env-var baseUrl=http://localhost:3000

      - name: Vistas responden con datos
        run: |
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/recordings | grep -q 302
          curl -s -c session.txt -o /dev/null --data-urlencode "email=sebastian@recall.app" --data-urlencode "password=Recall2026!" http://localhost:3000/login
          curl -sf -b session.txt http://localhost:3000/recordings | grep -q "Clase de Bases de Datos"
          curl -sf -b session.txt http://localhost:3000/recordings/22222222-2222-4222-8222-000000000001 | grep -q "Transcripción"

      - name: Id de petición (X-Request-Id)
        run: |
          curl -si http://localhost:3000/health | grep -iq '^x-request-id: [0-9a-f-]\{36\}'
          curl -si -H "X-Request-Id: ci-check-123" http://localhost:3000/health | grep -iq '^x-request-id: ci-check-123'
          curl -s http://localhost:3000/api/v1/no-existe | grep -q '"requestId"'
          grep -q 'ci-check-123' server.log

      - name: Documentación del API (Swagger)
        run: |
          curl -sf http://localhost:3000/docs/ | grep -q "swagger-ui"
          curl -sf -o /dev/null http://localhost:3000/docs/swagger-ui.css
          curl -sf http://localhost:3000/docs/openapi.json -o openapi.json
          node -e 'const s = require("./openapi.json"); if (!s.paths["/health"]) { console.error("La especificación no tiene /health: swagger-jsdoc no encontró los comentarios @openapi"); process.exit(1); }'
          npx --yes @redocly/cli@2.65.0 lint openapi.json --format=stylish

      - name: El log no contiene contraseñas ni tokens
        run: |
          if grep -E 'Recall2026!|eyJhbGci' server.log; then
            echo "El log contiene la contraseña del seed o un JWT"
            exit 1
          fi

      - name: Logs del servidor
        if: always()
        run: cat server.log || true
