# Configuración del análisis de SonarQube Cloud
# sonar.organization y sonar.projectKey se crean en https://sonarcloud.io al importar el repo
sonar.organization=sebastian0023
sonar.projectKey=sebastian0023_Recall
sonar.projectName=Recall API

sonar.sources=src
sonar.exclusions=src/generated/**,dist/**,node_modules/**
sonar.sourceEncoding=UTF-8

# Reporte de ESLint generado por el workflow (npm run lint:report)
sonar.eslint.reportPaths=eslint-report.json
