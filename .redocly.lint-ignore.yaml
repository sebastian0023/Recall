# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
#
# Advertencias que no aplican: el login con Google solo redirige (302, sin 2xx ni 4xx) y /health no tiene un error 4xx
# que documentar. Si se agrega otra ruta de este tipo, se regenera con: npx @redocly/cli lint openapi.json --generate-ignore-file
openapi.json:
  operation-2xx-response:
    - '#/paths/~1auth~1google/get/responses'
    - '#/paths/~1google_confirm/get/responses'
  operation-4xx-response:
    - '#/paths/~1auth~1google/get/responses'
    - '#/paths/~1google_confirm/get/responses'
    - '#/paths/~1health/get/responses'
