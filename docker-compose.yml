services:
  db:
    image: postgres:17
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Servidor SMTP de pruebas: recibe los correos del API y los muestra en http://localhost:8025 (no manda nada a internet)
  mail:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # interfaz web

volumes:
  pgdata:
